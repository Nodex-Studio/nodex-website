name: Deploy to GitHub Pages

# Publishes the static site to GitHub Pages on every push to main.
# Uses the GitHub Actions Pages flow (no "deploy from branch" needed).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the deploy job needs to publish Pages via the workflow token.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # Pages must be enabled once with source = "GitHub Actions"
        # (repo Settings → Pages, or `gh api -X POST .../pages -f build_type=workflow`).
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
