name: Build and deploy architecture document

on:
  push:
    branches: [main]
    paths:
      - "*.md"
      - "adr/**"
      - "diagrams/*.svg"
      - "html/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than
# publishing a half-built document.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install --quiet "markdown==3.5.2"

      - name: Build the document
        run: python3 html/build.py

      - name: Verify the build
        run: |
          python3 html/test_technical.py
          proposal=html/dist/index.html
          test -s "$proposal" || { echo "::error::proposal missing"; exit 1; }
          grep -q 'id="studio-document"' "$proposal" || { echo "::error::studio document missing"; exit 1; }
          grep -q 'id="architecture"' "$proposal" || { echo "::error::architecture missing"; exit 1; }
          grep -q 'id="proof"' "$proposal" || { echo "::error::pilot missing"; exit 1; }
          grep -q 'id="bipp"' "$proposal" || { echo "::error::bipp foundation missing"; exit 1; }
          grep -q 'id="evidence"' "$proposal" || { echo "::error::evidence missing"; exit 1; }
          grep -q 'data-layer="data"' "$proposal" || { echo "::error::data layer missing"; exit 1; }
          ! grep -q 'technical.html#' "$proposal" || { echo "::error::legacy appendix link"; exit 1; }
          ! grep -q '<pre>' "$proposal" || { echo "::error::code examples in proposal"; exit 1; }
          grep -q 'id="technical-document"' html/dist/technical.html || { echo "::error::native technical reference missing"; exit 1; }
          grep -q 'id="runtime"' html/dist/technical.html || { echo "::error::native runtime contract missing"; exit 1; }
          test -s html/dist/technical-contracts.ts || { echo "::error::contract download missing"; exit 1; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: html/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
